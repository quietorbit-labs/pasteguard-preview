name: Build verified silent video library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [automation/build_library.py, automation/cloud-publisher.mjs, .github/workflows/pasteguard-library.yml]
permissions:
  contents: write
concurrency:
  group: pasteguard-video-library
  cancel-in-progress: false
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify timer and duplicate protection
        run: node automation/test-cloud-publisher.mjs
      - name: Install rendering tools
        run: |
          python -m pip install 'Pillow>=11,<13'
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Capture, verify and host the silent library
        run: python automation/build_library.py
